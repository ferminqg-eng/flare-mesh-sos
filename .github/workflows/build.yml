name: Build FlareMesh SOS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inicializar proyecto nativo Android y aplicar Manifiesto + Desugaring
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.custom.xml
          cp ios/Runner/Info.plist /tmp/Info.custom.plist
          cp ios/Runner/Runner.entitlements /tmp/Runner.custom.entitlements
          rm -rf android ios
          flutter create --platforms=android,ios --org com.offgrid --project-name flare_mesh_sos .
          rm -f test/widget_test.dart
          cp /tmp/AndroidManifest.custom.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/Info.custom.plist ios/Runner/Info.plist
          cp /tmp/Runner.custom.entitlements ios/Runner/Runner.entitlements

          python3 - <<'EOF'
          import pathlib, re

          kts = pathlib.Path("android/app/build.gradle.kts")
          groovy = pathlib.Path("android/app/build.gradle")

          if kts.exists():
              txt = kts.read_text()
              txt = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 37', txt)
              txt = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 24', txt)
              txt = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36\n        multiDexEnabled = true', txt)
              if 'isCoreLibraryDesugaringEnabled' not in txt:
                  txt = txt.replace(
                      'compileOptions {',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true'
                  )
              if 'desugar_jdk_libs' not in txt:
                  txt += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              kts.write_text(txt)
              print("Patched android/app/build.gradle.kts successfully")
          elif groovy.exists():
              txt = groovy.read_text()
              txt = re.sub(r'compileSdk\s+[^\n]+', 'compileSdk 37', txt)
              txt = re.sub(r'minSdk\s+[^\n]+', 'minSdk 24', txt)
              txt = re.sub(r'targetSdk\s+[^\n]+', 'targetSdk 36\n        multiDexEnabled true', txt)
              if 'coreLibraryDesugaringEnabled' not in txt:
                  txt = txt.replace(
                      'compileOptions {',
                      'compileOptions {\n        coreLibraryDesugaringEnabled true'
                  )
              if 'desugar_jdk_libs' not in txt:
                  txt += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              groovy.write_text(txt)
              print("Patched android/app/build.gradle successfully")

          gp = pathlib.Path("android/gradle.properties")
          if gp.exists():
              gp.write_text(gp.read_text() + "\nandroid.suppressUnsupportedCompileSdk=37\n")
          EOF

      - name: Instalar dependencias Dart/Flutter
        run: flutter pub get

      - name: Parchear flutter_ble_peripheral para resiliencia de antena en Android
        run: |
          python3 - <<'EOF'
          import pathlib, os

          cache = pathlib.Path(os.environ.get('PUB_CACHE', os.path.expanduser('~/.pub-cache')))
          for p in cache.glob('**/FlutterBlePeripheralManager.kt'):
              txt = p.read_text()
              txt = txt.replace(
                  'var mBluetoothManager: BluetoothManager? = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager',
                  'val mBluetoothManager: BluetoothManager?\n        get() = context.getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager'
              )
              txt = txt.replace(
                  'var mBluetoothLeAdvertiser: BluetoothLeAdvertiser? = mBluetoothManager?.adapter?.bluetoothLeAdvertiser',
                  'val mBluetoothLeAdvertiser: BluetoothLeAdvertiser?\n        get() = mBluetoothManager?.adapter?.bluetoothLeAdvertiser'
              )
              txt = txt.replace(
                  'mBluetoothLeAdvertiser!!.startAdvertising(',
                  'val adv = mBluetoothLeAdvertiser\n        if (adv == null) {\n            mAdvertiseCallback.onStartFailure(android.bluetooth.le.AdvertiseCallback.ADVERTISE_FAILED_INTERNAL_ERROR)\n            return\n        }\n        adv.startAdvertising('
              )
              p.write_text(txt)
              print(f"Patched: {p}")
          EOF

      - name: Generar íconos nativos (Sobre con Campana en Llamas)
        run: dart run flutter_launcher_icons

      - name: Ejecutar pruebas unitarias del protocolo binario BLE Mesh
        run: flutter test test/mesh_packet_codec_test.dart

      - name: Compilar APK Release
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk FlareMeshSOS.apk

      - name: Subir APK como Artifact de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: flare-mesh-sos-apk
          path: FlareMeshSOS.apk

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: FlareMesh SOS v1.2.${{ github.run_number }} (Release APK - Bridgefy/Meshtastic Radio Fix)
          body: |
            Actualización Release de Conectividad Mesh (v1.2):
            - Escaneo BLE Legacy obligatorio (androidLegacy: true en 1M PHY) para sintonizar anuncios periféricos directos.
            - Prevención de fallos silenciosos por servicios de ubicación en Android (androidCheckLocationServices: false y permisos pre-validados en UI).
            - Parche nativo en flutter_ble_peripheral: resolución dinámica de BluetoothLeAdvertiser sin fallos por NPE.
            - Fallback resiliente en decodificación de tramas de fabricante (coincidencia 0xFF45, endianness invertido y tamaño exacto de 20 bytes).
            - Barra de telemetría y diagnósticos de radio en tiempo real en la pantalla de inicio.
          files: FlareMeshSOS.apk
